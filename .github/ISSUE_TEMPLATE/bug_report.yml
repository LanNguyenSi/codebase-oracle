name: Bug report
description: Report a defect in codebase-oracle
labels: ["bug"]
body:
  - type: dropdown
    id: verb
    attributes:
      label: MCP verb / surface
      options:
        - oracle_search
        - oracle_query
        - oracle_expand
        - oracle_list_repos
        - indexing pipeline
        - install / native deps
        - other / unsure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs. actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal commands or input that trigger the bug.
      render: bash
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: codebase-oracle version
      placeholder: "0.x.y"
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.x"
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 14 / Ubuntu 22.04 / Windows 11"
