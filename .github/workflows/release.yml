name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: GitHub Release
    # Wait for npm-publish so a failed publish doesn't strand a GitHub Release
    # without its npm tarball.
    needs: [ci, npm-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          awk '/^## \[${{ steps.version.outputs.version }}\]/{found=1; next} /^## \[/{found=0} found' CHANGELOG.md > release_notes.md
          echo "Release notes extracted for v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          generate_release_notes: false

  npm-publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for npm provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match package.json $pkg_version"
            exit 1
          fi

      # npm Trusted Publishing (OIDC) needs npm >= 11.5.1; node 22 bundles
      # npm 10, so upgrade right before the publish step (wave standard:
      # install/build/test run under the node-bundled npm, matching ci.yml).
      # Auth comes from the GitHub OIDC token (id-token: write above) matched
      # against the package's Trusted Publisher entry on npmjs.com (repo
      # LanNguyenSi/codebase-oracle, workflow release.yml) — no NPM_TOKEN.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - run: npm publish --provenance --access public
