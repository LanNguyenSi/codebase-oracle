name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify native store deps load
        # Guard against silent ABI or postinstall failures in better-sqlite3
        # or sqlite-vec — both ship loadable native binaries and a broken
        # install would otherwise only surface late in the test suite.
        run: node -e "const D=require('better-sqlite3');const v=require('sqlite-vec');const db=new D(':memory:');v.load(db);const {r}=db.prepare('SELECT vec_version() AS r').get();console.log('sqlite-vec',r);db.close();"

      - name: Type check
        run: npx tsc --noEmit

      - name: Type check tests
        # src/ is type-checked above via the default tsconfig.json (rootDir:
        # src), which never sees the test tree. vitest runs tests through
        # esbuild and doesn't typecheck either, so a test file can drift out
        # of sync with a src/ type change (eg a newly required Config field)
        # and nothing catches it until someone runs tsc by hand. This closes
        # that gap; tests/eval/corpus/ is excluded in tsconfig.tests.json
        # since it's vendored fixture text, not real project source.
        run: npx tsc --noEmit -p tsconfig.tests.json

      - name: Test
        run: npx vitest run --coverage
